site_name: Backend Engineering Study Guide
site_description: Complete curriculum for backend engineers - Build a PDF conversion platform
site_author: Ahmed Abdelmoteleb
site_url: https://backend-engineering.guide
docs_dir: site_docs
site_dir: ../site

theme:
  name: material
  language: en
  palette:
    - scheme: light
      primary: indigo
      accent: blue
    - scheme: dark
      primary: indigo
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: en
  - offline

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite
  - def_list
  - footnotes
  - md_in_html
  - meta
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true

extra:
  analytics:
    provider: google
    property: G-XXXXXXXXXXXX

